<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pregnancy Dating Calculator | Beergeel Obstetrics and Gynecology Clinic</title>
<meta name="theme-color" content="#2f5597">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beergeel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root { --bg1:#2f5597; --bg2:#3a62a3; --panel:#5077ae; --blue:#2b79b8; --blue-dark:#215f93; --navy:#1f3d6e; --ink:#1c2a3f; --muted:#5b6b82; --line:#d5e0f1; --field:#eaf1fe; --soft:#eef4fc; --red:#b3261e; --green:#1f7a4d; }
  * { box-sizing:border-box; }
  html { background:#365d9f; }
  body { margin:0; padding:20px; padding-top:max(20px,env(safe-area-inset-top)); padding-bottom:max(20px,env(safe-area-inset-bottom)); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--ink); line-height:1.5; min-height:100vh; }
  main { max-width:820px; margin:0 auto; }
  .topbar { display:flex; justify-content:flex-end; margin-bottom:12px; }
  .lang { display:inline-flex; border:2px solid #fff; border-radius:999px; overflow:hidden; }
  .lang button { width:auto; margin:0; border:0; border-radius:0; padding:8px 18px; font-weight:700; font-size:.9rem; font-family:inherit; background:transparent; color:#fff; cursor:pointer; }
  .lang button[aria-pressed="true"] { background:#fff; color:var(--navy); }
  .hero-card { background:var(--panel); border-radius:24px; padding:30px 24px 28px; text-align:center; color:#fff; box-shadow:0 8px 28px #0b1f4a40; }
  .logo-ring { width:124px; height:124px; margin:0 auto 14px; border-radius:50%; background:#fff; border:5px solid #ffffff80; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .logo-ring img { width:76%; height:76%; object-fit:contain; display:block; }
  .clinic { font-size:clamp(1.5rem,4.6vw,2.3rem); font-weight:800; line-height:1.2; margin:0; letter-spacing:-.01em; }
  .tag { font-size:1.05rem; margin:6px 0 0; opacity:.95; }
  .meta { margin:14px 0 0; font-size:.9rem; opacity:.95; display:flex; flex-wrap:wrap; gap:6px 22px; justify-content:center; }
  h1 { color:#fff; text-align:center; font-size:clamp(1.4rem,4.2vw,2rem); line-height:1.25; margin:30px 0 6px; }
  .sub { color:#e3ecfa; text-align:center; margin:0 auto 18px; max-width:620px; }
  .card { background:#fff; border-radius:24px; padding:26px; margin:16px 0; box-shadow:0 8px 28px #0b1f4a33; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input, select { width:100%; padding:13px 14px; border:1px solid #c3d3ec; border-radius:10px; font-size:1rem; background:var(--field); color:var(--ink); font-family:inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline:3px solid #7fb2e5; outline-offset:1px; }
  .methods { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .method { border:1px solid var(--line); padding:13px; border-radius:12px; display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:700; margin:0; background:#fff; }
  .method:has(input:checked) { border-color:var(--blue); background:var(--soft); }
  .method input { width:auto; margin:0; accent-color:var(--blue); }
  .qtitle { font-weight:700; margin:0 0 8px; }
  .keepbox { margin-top:20px; padding:16px; border-radius:14px; background:var(--soft); border:1px solid var(--line); }
  .keepbox .methods { margin-top:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hidden { display:none !important; }
  button.primary { width:100%; border:0; border-radius:10px; padding:15px; margin-top:22px; font-weight:700; font-size:1.05rem; font-family:inherit; cursor:pointer; background:var(--blue); color:#fff; }
  button.primary:hover { background:var(--blue-dark); }
  button.secondary { width:100%; border:2px solid var(--blue); border-radius:10px; padding:12px; margin-top:12px; font-weight:700; font-family:inherit; font-size:.95rem; cursor:pointer; background:#fff; color:var(--blue-dark); }
  button.linkbtn { background:none; border:0; padding:8px; margin-top:10px; width:100%; color:var(--muted); font-family:inherit; font-size:.9rem; text-decoration:underline; cursor:pointer; }
  button.danger { color:var(--red); }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
  .welcome { text-align:center; padding:34px 26px; }
  .welcome h2 { margin:0; font-size:clamp(1.6rem,6vw,2.3rem); color:var(--navy); line-height:1.2; overflow-wrap:anywhere; }
  .welcome p { color:var(--muted); margin:8px 0 0; }
  .result { display:none; }
  .result.show { display:block; }
  .hero { border-radius:18px; background:var(--soft); border:1px solid var(--line); padding:22px 20px; text-align:center; }
  .hero .cap { font-size:1rem; color:var(--muted); overflow-wrap:anywhere; }
  .hero .big { font-size:clamp(2.2rem,9.5vw,3.7rem); font-weight:800; color:var(--navy); margin:6px 0 2px; line-height:1.1; }
  .hero .line2 { font-size:clamp(1.15rem,4.6vw,1.6rem); font-weight:700; color:var(--ink); margin-top:6px; }
  .hero .line { font-size:1rem; color:var(--muted); margin-top:2px; }
  .hero .left { font-size:clamp(1.05rem,4vw,1.35rem); font-weight:700; color:var(--blue-dark); margin-top:12px; }
  .status { margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .metric { border:1px solid var(--line); border-radius:12px; padding:13px 14px; min-width:0; }
  .metric .k { font-size:.84rem; color:var(--muted); margin-bottom:4px; }
  .metric .v { font-weight:700; font-size:1.12rem; overflow-wrap:anywhere; }
  .metric .r { font-size:.85rem; color:var(--muted); margin-top:2px; }
  .metric.focus { border:2px solid var(--blue); background:#fff; }
  .results-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .bar { margin-top:22px; }
  .bar .track { position:relative; display:flex; height:16px; border-radius:8px; overflow:hidden; }
  .bar .seg { height:100%; border-right:2px solid #fff; }
  .bar .pin { position:absolute; top:-5px; width:4px; height:26px; background:var(--ink); border-radius:2px; transform:translateX(-2px); }
  .bar .ticks { position:relative; height:18px; font-size:.75rem; color:var(--muted); }
  .bar .ticks span { position:absolute; transform:translateX(-50%); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:8px; font-size:.8rem; color:var(--muted); }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .note { font-size:.9rem; color:var(--muted); }
  h3 { margin:0 0 8px; font-size:1.1rem; color:var(--navy); }
  .chartbox { margin-top:24px; }
  .chartwrap { position:relative; border:1px solid var(--line); border-radius:16px; overflow:hidden; background:#fff; }
  .chartwrap img { display:block; width:100%; height:auto; }
  .marker { position:absolute; transform:translate(-50%,-50%); aspect-ratio:1/1; border-radius:50%; border:4px solid #1565c0; box-shadow:0 0 0 3px #fff, 0 0 12px #1565c0aa; pointer-events:none; }
  .marker::after { content:""; position:absolute; inset:-4px; border-radius:50%; border:3px solid #1565c0; opacity:.7; animation:pulse 1.8s ease-out infinite; }
  @keyframes pulse { from { transform:scale(1); opacity:.7; } to { transform:scale(1.5); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .marker::after { animation:none; } }
  .chartcap { margin:10px 0 2px; font-weight:700; color:var(--navy); }
  .weeknote { margin-top:22px; padding:18px; border:1px solid var(--line); border-radius:16px; background:#fff; }
  .weeknote p { margin:0 0 10px; }
  .weeknote .appt { font-weight:600; }
  .danger-box { border:2px solid var(--red); background:#fdeceb; border-radius:12px; padding:14px 16px; }
  .danger-box strong { color:var(--red); }
  .danger-box ul { margin:8px 0 8px; padding-left:22px; }
  .danger-box p { margin:6px 0 0; font-weight:700; }
  .movebox { margin-top:22px; padding:20px; border-radius:16px; background:var(--soft); border:1px solid var(--line); text-align:center; }
  .movepill { display:inline-block; padding:6px 16px; border-radius:999px; background:var(--navy); color:#fff; font-weight:700; font-size:.9rem; }
  .movecount { font-size:clamp(3.5rem,18vw,5.5rem); font-weight:800; line-height:1.1; color:var(--navy); margin-top:10px; }
  .movesub { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
  .movebtn { width:100%; min-height:120px; border:0; border-radius:28px; background:var(--blue); color:#fff; font-family:inherit; font-size:clamp(1.6rem,7vw,2.2rem); font-weight:800; cursor:pointer; box-shadow:0 6px 0 var(--blue-dark); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .movebtn:active { transform:translateY(4px); box-shadow:0 2px 0 var(--blue-dark); }
  .movelinks { display:flex; gap:10px; justify-content:center; }
  .movelinks .linkbtn { width:auto; }
  .savedmsg { color:var(--green); font-weight:700; font-size:.92rem; margin:14px 0 0; }
  .error { color:var(--red); margin-top:12px; font-weight:700; }
  .install h3 { margin:0 0 4px; font-size:1.05rem; color:var(--navy); }
  .install p { margin:0; font-size:.92rem; color:var(--muted); }
  .install .help { margin-top:10px; padding:12px; background:var(--soft); border-radius:10px; font-size:.92rem; color:var(--ink); }
  footer { font-size:.85rem; color:#e3ecfa; padding:10px 6px 24px; }
  footer table { border-collapse:collapse; margin:8px 0 12px; width:100%; }
  footer td { border-top:1px solid #ffffff40; padding:5px 8px 5px 0; vertical-align:top; }
  @media (max-width:560px) { body { padding:12px; } .card { padding:18px; border-radius:20px; } .grid,.results-grid,.methods,.status,.actions { grid-template-columns:1fr; } .logo-ring { width:100px; height:100px; } }
  @media print {
    body { background:#fff; padding:0; color:#000; }
    .topbar,.form-card,.noprint,footer,.sub,.welcome { display:none !important; }
    .hero-card { background:none; color:#000; box-shadow:none; padding:0 0 10px; }
    .card { box-shadow:none; padding:0; }
    .result { display:block !important; }
    h1 { color:#000; margin-top:10px; }
    .hero,.bar .seg,.legend i { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
  .topbar { align-items:center; justify-content:space-between !important; }
  .backlink { color:#fff; font-weight:700; font-size:.9rem; text-decoration:none; padding:8px 4px; }
  .backlink:hover { text-decoration:underline; }
</style>
</head>

    <p class="tag" data-i18n="tagline"></p>

  <h1 data-i18n="title"></h1>
  <p class="sub" data-i18n="subtitle"></p>

  <!-- Returning patient -->
  <section id="welcome" class="card welcome hidden">
    <h2 id="welcomeTitle"></h2>
    <p data-i18n="welcomeText"></p>
    <button id="loginBtn" type="button" class="primary" data-i18n="loginBtn"></button>
    <button id="notYouBtn" type="button" class="linkbtn" data-i18n="notYou"></button>
  </section>

  <!-- Calculator form -->
  <section id="formCard" class="card form-card">
    <label for="patientName" style="margin-top:0" data-i18n="patientName"></label>
    <input type="text" id="patientName" maxlength="60" autocomplete="name" data-i18n-ph="namePh">

    <div class="qtitle" style="margin-top:18px" data-i18n="chooseMethod"></div>
    <div class="methods">
      <label class="method"><input type="radio" name="method" value="lnmp" checked> <span data-i18n="fromLnmp"></span></label>
      <label class="method"><input type="radio" name="method" value="us"> <span data-i18n="fromUs"></span></label>
    </div>

    <div id="lnmpFields">
      <label for="lnmp" data-i18n="lnmpLabel"></label>
      <input type="date" id="lnmp">
    </div>

    <div id="usFields" class="hidden">
      <label for="scanDate" data-i18n="scanDate"></label>
      <input type="date" id="scanDate">
      <div class="grid">
        <div>
          <label for="usWeeks" data-i18n="usWeeks"></label>
          <input type="number" id="usWeeks" min="0" max="45" step="1" inputmode="numeric" placeholder="12">
        </div>
        <div>
          <label for="usDays" data-i18n="usDays"></label>
          <select id="usDays"></select>
        </div>
      </div>
    </div>

    <label for="assessmentDate" data-i18n="asOf"></label>
    <input type="date" id="assessmentDate">

    <div class="keepbox">
      <div class="qtitle" data-i18n="keepQ"></div>
      <div class="methods">
        <label class="method"><input type="radio" name="keep" value="yes" checked> <span data-i18n="keepYes"></span></label>
        <label class="method"><input type="radio" name="keep" value="no"> <span data-i18n="keepNo"></span></label>
      </div>
      <p class="note" style="margin:10px 0 0" data-i18n="keepNote"></p>
    </div>

    <button id="calculateBtn" type="button" class="primary" data-i18n="calculate"></button>
    <div id="error" class="error" role="alert"></div>
  </section>

  <!-- Results / daily summary -->
  <section id="result" class="card result" aria-live="polite">
    <div class="hero">
      <div class="cap" id="gaCap">—</div>
      <div class="big" id="gaWD">—</div>
      <div class="line2" id="gaMD">—</div>
      <div class="line" id="gaDays">—</div>
      <div class="left" id="gaLeft"></div>
    </div>

    <div class="status">
      <div class="metric focus">
        <div class="k" data-i18n="classLabel"></div>
        <div class="v" id="classResult">—</div>
        <div class="r" id="classRange"></div>
      </div>
      <div class="metric focus">
        <div class="k" data-i18n="trimLabel"></div>
        <div class="v" id="trimResult">—</div>
        <div class="r" id="trimRange"></div>
      </div>
    </div>

    <div class="results-grid">
      <div class="metric"><div class="k" data-i18n="edd"></div><div class="v" id="eddResult">—</div></div>
      <div class="metric"><div class="k" data-i18n="conception"></div><div class="v" id="conceptionResult">—</div></div>
      <div class="metric"><div class="k" data-i18n="monthLabel"></div><div class="v" id="monthResult">—</div></div>
      <div class="metric"><div class="k" data-i18n="startLabel"></div><div class="v" id="startResult">—</div></div>
    </div>

    <div class="bar">
      <div class="track" id="track"></div>
      <div class="ticks" id="ticks"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div id="chartBox" class="chartbox">
      <h3 data-i18n="chartTitle"></h3>
      <div class="chartwrap">
        <img id="chartImg" src="fetal-chart.jpg" width="1000" height="969" alt="Fetal development chart">
        <div id="chartMarkers"></div>
      </div>
      <p class="chartcap" id="chartCap"></p>
      <p class="note" data-i18n="chartNote"></p>
    </div>

    <div class="weeknote">
      <h3 data-i18n="noteTitle"></h3>
      <p id="weekExtra" class="hidden"></p>
      <p class="appt" data-i18n="noteAppt"></p>
      <div class="danger-box">
        <strong data-i18n="dangerTitle"></strong>
        <ul id="dangerList"></ul>
        <p data-i18n="dangerAct"></p>
      </div>
    </div>

    <div id="moveBox" class="movebox noprint hidden">
      <span class="movepill" data-i18n="moveTitle"></span>
      <div id="moveCount" class="movecount" aria-live="polite">0</div>
      <div class="movesub" data-i18n="moveToday"></div>
      <button id="moveBtn" type="button" class="movebtn" data-i18n="moveBtn"></button>
      <div class="movelinks">
        <button type="button" class="linkbtn" id="moveUndo" data-i18n="moveUndo"></button>
        <button type="button" class="linkbtn" id="moveReset" data-i18n="moveReset"></button>
      </div>
    </div>

    <p id="savedMsg" class="savedmsg noprint hidden" data-i18n="savedMsg"></p>
    <p id="datingSource" class="note"></p>
    <p id="clinicalNote" class="note" data-i18n="clinicalNote"></p>

    <div class="actions noprint">
      <button type="button" class="secondary" id="saveImgBtn" data-i18n="saveImg"></button>
      <button type="button" class="secondary" id="printBtn" data-i18n="print"></button>
    </div>
    <button type="button" class="secondary noprint hidden" id="calcNewBtn" data-i18n="calcNew"></button>
    <button type="button" class="linkbtn danger noprint hidden" id="forgetBtn" data-i18n="forget"></button>

    const cls = find(CLASSES, s.totalDays), tr = find(TRIMS, s.totalDays);
    const left = 280 - s.totalDays;
    let leftText;
    if (left > 0) leftText = t.toGo.replace('{n}', plural(left, t.day));
    else if (left === 0) leftText = t.eddToday;
    else leftText = t.pastEdd.replace('{n}', plural(-left, t.day));

    if (s.daily) cap = s.name ? t.capTodayNamed.replace('{name}', s.name) : t.capToday;
    else cap = s.name ? t.capCalcNamed.replace('{name}', s.name) : t.capCalc;

      cap, weeks,
      wd: plural(weeks, t.week) + ' + ' + plural(rem, t.day),
      md: plural(md.months, t.month) + ' + ' + plural(md.days, t.day),

  }

  function renderExtras(s, c) {
    const t = T[lang], w = c.weeks;
    // chart marker
    const st = STAGES.find(x => w >= x.a && w <= x.b);
    $('chartMarkers').innerHTML = st.pts.map(p =>
      '<div class="marker" style="left:' + (p[0] / IMG_W * 100) + '%;top:' + (p[1] / IMG_H * 100) + '%;width:' + (p[2] / IMG_W * 100) + '%"></div>').join('');
    const stageName = st.k === 'w' ? plural(st.n, t.week) : plural(st.n, t.month);
    $('chartCap').textContent = t.chartMark.replace('{stage}', stageName) + (st.mm ? ' ' + t.chartSize.replace('{mm}', st.mm) : '');
    // weekly note
    const extra = (WEEK_EXTRA[lang] || {})[w];
    $('weekExtra').textContent = extra || '';
    $('weekExtra').classList.toggle('hidden', !extra);
    // movement counter
    const show = s.totalDays >= MOVE_FROM_DAYS;
    $('moveBox').classList.toggle('hidden', !show);
    if (show) { if (kicks.date !== inputValue(todayUTC()) || !kicksReady) { loadKicks(); kicksReady = true; } showKicks(); }
  }

  function openDaily() {
    if (!profile) return setView('form');
    const start = parseDate(profile.start), a = todayUTC();
    const total = Math.round((a - start) / DAY);
    if (total < 0) { lastErrKey = 'errInvalid'; $('error').textContent = T[lang].errInvalid; return setView('form'); }
    last = { method: profile.method || 'lnmp', start, assessment: a, totalDays: total, name: profile.name, daily: true };
    justSaved = false;
    render(last);
    setView('daily');
  }

  /* ---------- static text ---------- */
  function renderWelcome() {
    $('welcomeTitle').textContent = T[lang].welcomeBack.replace('{name}', profile ? profile.name : '');
  }
  function applyLang() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t[el.dataset.i18nPh]; });
    $('langEn').setAttribute('aria-pressed', lang === 'en');
    $('langSo').setAttribute('aria-pressed', lang === 'so');
    const sel = $('usDays'), cur = sel.value || '0';
    sel.innerHTML = '';
    for (let i = 0; i <= 6; i++) { const o = document.createElement('option'); o.value = i; o.textContent = plural(i, t.day); sel.appendChild(o); }
    sel.value = cur;
    $('dangerList').innerHTML = t.danger.map(x => '<li>' + x + '</li>').join('');
    $('refTable').innerHTML = CLASSES.map(c => '<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:' + c.color + ';margin-right:6px"></i>' + t.cls[c.key] + '</td><td>' + c.range + '</td></tr>').join('') +
      TRIMS.map(c => '<tr><td>' + t.trim[c.key] + '</td><td>' + c.range + '</td></tr>').join('');
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    $('installHelp').textContent = ios ? t.helpIos : t.helpOther;
    if (lastErrKey) $('error').textContent = t[lastErrKey];
    renderWelcome();
    if (last && (view === 'calc' || view === 'daily')) render(last);
  }
  function setLang(l) { lang = l; try { localStorage.setItem(LKEY, l); } catch (e) {} applyLang(); }
  $('langEn').addEventListener('click', () => setLang('en'));
  $('langSo').addEventListener('click', () => setLang('so'));

  /* ---------- form ---------- */
  const getMethod = () => document.querySelector('input[name="method"]:checked').value;
  const getKeep = () => document.querySelector('input[name="keep"]:checked').value === 'yes';
  function syncMethod() {
    const isL = getMethod() === 'lnmp';
    $('lnmpFields').classList.toggle('hidden', !isL);
    $('usFields').classList.toggle('hidden', isL);
    lastErrKey = null; $('error').textContent = '';
    if (view === 'calc') { last = null; setView('form'); }
  }
  document.querySelectorAll('input[name="method"]').forEach(r => r.addEventListener('change', syncMethod));
  $('assessmentDate').value = inputValue(todayUTC());

  function fail(key) { lastErrKey = key; $('error').textContent = T[lang][key]; }

  $('calculateBtn').addEventListener('click', function () {
    lastErrKey = null; $('error').textContent = '';
    justSaved = false;
    const keep = getKeep();
    const name = $('patientName').value.trim();
    if (keep && !name) return fail('errName');

    const method = getMethod();
    const assessment = parseDate($('assessmentDate').value);
    if (!assessment) return fail('errAssess');

    let start;
    if (method === 'lnmp') {
      start = parseDate($('lnmp').value);
      if (!start) return fail('errLnmp');
      if (start > assessment) return fail('errLnmpAfter');
    } else {
      const scan = parseDate($('scanDate').value);
      const wRaw = $('usWeeks').value, d = Number($('usDays').value), w = Number(wRaw);
      if (!scan || wRaw === '' || !Number.isInteger(w) || w < 0 || w > 45 || (w === 45 && d > 0)) return fail('errUs');
      if (scan > assessment) return fail('errUsAfter');
      start = addDays(scan, -(w * 7 + d));
    }
    const totalDays = Math.round((assessment - start) / DAY);
    if (totalDays < 0) return fail('errInvalid');

    if (keep) {
      const p = { v:1, name, method, start: inputValue(start), savedAt: new Date().toISOString() };
      if (saveProfile(p)) { profile = p; justSaved = true; }
      else fail('errSave');
    }
    last = { method, start, assessment, totalDays, name, daily: false };
    render(last);
    setView('calc');
    $('result').scrollIntoView({ behavior:'smooth', block:'start' });
  });

  $('loginBtn').addEventListener('click', openDaily);
  $('calcNewBtn').addEventListener('click', function () {
    if (profile) $('patientName').value = profile.name;
    $('assessmentDate').value = inputValue(todayUTC());
    last = null; setView('form'); window.scrollTo(0, 0);
  });
  function forgetAll() {
    if (!window.confirm(T[lang].confirmForget)) return;
    clearProfile(); try { localStorage.removeItem(KKEY); } catch (e) {} kicks = { date:'', count:0 }; kicksReady = false; profile = null; last = null; justSaved = false;
    $('patientName').value = '';
    renderWelcome(); setView('form'); window.scrollTo(0, 0);
  }
  $('forgetBtn').addEventListener('click', forgetAll);
  $('notYouBtn').addEventListener('click', forgetAll);
  $('printBtn').addEventListener('click', () => window.print());
  $('moveBtn').addEventListener('click', () => bumpKicks(1));
  $('moveUndo').addEventListener('click', () => bumpKicks(-1));
  $('moveReset').addEventListener('click', () => { if (kicks.count > 0 && window.confirm(T[lang].confirmReset)) { kicks.count = 0; saveKicks(); showKicks(); } });
  $('chartImg').addEventListener('error', () => $('chartBox').classList.add('hidden'));

  // keep the daily screen correct if the app stays open past midnight
  document.addEventListener('visibilitychange', () => { if (!document.hidden && view === 'daily') openDaily(); });

  /* ---------- save as image (PNG) ---------- */
  function rr(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function fit(ctx, text, maxW, size, weight) {
    const fam = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
    ctx.font = weight + ' ' + size + 'px ' + fam;
    while (ctx.measureText(text).width > maxW && size > 18) { size -= 2; ctx.font = weight + ' ' + size + 'px ' + fam; }
  }
  function saveImage() {
    if (!last) return;
    const t = T[lang], c = compute(last);
    const W = 1080, H = 1700, cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2f5597'); g.addColorStop(1, '#3a62a3');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';

    // header panel
    ctx.fillStyle = '#5077ae'; rr(ctx, 60, 60, 960, 380, 44); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(540, 190, 84, 0, Math.PI * 2); ctx.fill();
    const img = $('logoImg');
    if (img && img.complete && img.naturalWidth) {
      const hh = 120, ww = hh * img.naturalWidth / img.naturalHeight;
      ctx.drawImage(img, 540 - ww / 2, 190 - hh / 2, ww, hh);
    }
    ctx.fillStyle = '#fff';
    fit(ctx, t.clinic, 860, 48, '800'); ctx.fillText(t.clinic, 540, 340);
    fit(ctx, t.tagline, 860, 30, '400'); ctx.fillText(t.tagline, 540, 388);

    // title
    ctx.fillStyle = '#fff'; fit(ctx, t.imgTitle, 960, 44, '800'); ctx.fillText(t.imgTitle, 540, 510);

    // main card
    ctx.fillStyle = '#fff'; rr(ctx, 60, 550, 960, 1000, 44); ctx.fill();
    ctx.fillStyle = '#eef4fc'; rr(ctx, 90, 580, 900, 350, 30); ctx.fill();
    ctx.fillStyle = '#5b6b82'; fit(ctx, c.cap, 840, 32, '400'); ctx.fillText(c.cap, 540, 640);
    ctx.fillStyle = '#1f3d6e'; fit(ctx, c.wd, 840, 90, '800'); ctx.fillText(c.wd, 540, 740);
    ctx.fillStyle = '#1c2a3f'; fit(ctx, c.md, 840, 44, '700'); ctx.fillText(c.md, 540, 805);
    ctx.fillStyle = '#5b6b82'; fit(ctx, c.total, 840, 30, '400'); ctx.fillText(c.total, 540, 852);
    ctx.fillStyle = '#215f93'; fit(ctx, c.leftText, 840, 38, '700'); ctx.fillText(c.leftText, 540, 904);

    const rows = [
      [t.classLabel, c.clsName + '  (' + c.cls.range + ')'],
      [t.trimLabel, c.trName + '  (' + c.tr.range + ')'],
      [t.edd, c.edd],
      [t.monthLabel, c.month],
      [t.conception, c.conception]
    ];
    ctx.textAlign = 'left';
    let y = 990;
    rows.forEach((r, i) => {
      ctx.fillStyle = '#5b6b82'; fit(ctx, r[0], 840, 28, '400'); ctx.fillText(r[0], 100, y);
      ctx.fillStyle = '#1c2a3f'; fit(ctx, r[1], 840, 42, '700'); ctx.fillText(r[1], 100, y + 52);
      if (i < rows.length - 1) { ctx.fillStyle = '#d5e0f1'; ctx.fillRect(100, y + 76, 880, 2); }
      y += 112;
    });

    // footer
    ctx.textAlign = 'center'; ctx.fillStyle = '#e3ecfa';
    const now = new Date();
    const stamp = t.imgFooter + ' ' + String(now.getDate()).padStart(2, '0') + ' ' + t.months[now.getMonth()] + ' ' + now.getFullYear();
    fit(ctx, stamp, 900, 28, '400'); ctx.fillText(stamp, 540, 1610);
    fit(ctx, 'obgyn.beergeelclinic.com', 900, 28, '700'); ctx.fillText('obgyn.beergeelclinic.com', 540, 1654);

    cv.toBlob(function (blob) {
      if (!blob) return;
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = 'beergeel-pregnancy-' + inputValue(todayUTC()) + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  }
  $('saveImgBtn').addEventListener('click', saveImage);

  /* ---------- add to home screen ---------- */
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', () => $('installBox').classList.add('hidden'));
  if ((window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone) $('installBox').classList.add('hidden');
  $('installBtn').addEventListener('click', async function () {
    if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; }
    else $('installHelp').classList.remove('hidden');
  });
  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
  } catch (e) {}

  /* ---------- start ---------- */
  profile = loadProfile();
  applyLang();
  syncMethod();
  setView(profile ? 'welcome' : 'form');
})();
</script>
</body>
</html>
